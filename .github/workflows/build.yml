name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # WPF targets net8.0-windows and needs the Windows Desktop workload, so this
    # can only build on a Windows runner (not ubuntu-latest).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore FileBrowserApp.sln

      - run: dotnet build FileBrowserApp.sln --configuration Release --no-restore
